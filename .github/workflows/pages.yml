# Render analysis.qmd and deploy it to GitHub Pages.
# The report only reads committed CSVs/PNGs (no mrgsolve/ospsuite), so CI needs
# just R + a few light packages + Quarto -- fast and reliable.
name: Render and deploy report to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::knitr
            any::rmarkdown

      - name: Render Quarto report
        run: quarto render analysis.qmd

      - name: Prepare Pages site (index.html + .nojekyll)
        run: |
          cp reports/analysis.html reports/index.html
          touch reports/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
